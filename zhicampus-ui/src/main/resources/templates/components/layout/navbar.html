<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="navbar">
    <nav
            th:data-islogin="${global.isLogin}"
            class="navbar navbar-expand-md bg-color-white fixed-top"
    >
        <div class="nav-body">
            <div class="nav-logo-wrap-lg">
                <a class="navbar-logo-wrap" href="/">
                    <img class="logo" src="/img/logo.svg" th:src="${global.siteInfo.oss + '/img/logo.svg'}"/>
                    <img src="/img/icon.png" class="logo-lg" alt="" th:src="${global.siteInfo.oss + '/img/icon.png'}"/>
                </a>
                <div class="dropdown nav-menu-lg">
                    <div class="dropdown">
                        <div
                                class="nav-menu-lg-btn dropdown-toggle"
                                type="button"
                                data-toggle="dropdown"
                                aria-expanded="false"
                        >
                            首页
                        </div>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="/">首页</a>
                            <a class="dropdown-item" href="/column">教程</a>
                            <a class="dropdown-item" href="/chat">派聪明</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li
                            th:class="${'nav-item' + (!#strings.equals(global.currentDomain, 'column')
                    && !#strings.equals(global.currentDomain, 'follow')
                    && !#strings.equals(global.currentDomain, 'chat')? ' selected-domain' : '')}"
                            class="nav-item"
                    >
                        <a class="nav-link" href="/">首页</a>
                    </li>
                </ul>
            </div>
            <div class="nav-right">
                <button
                        type="button"
                        class="btn btn-primary nav-article"
                        th:data-target="${global.isLogin ? '' : '#loginModal'}"
                        th:data-toggle="${global.isLogin ? '' : 'modal'}"
                >
                    写文章
                </button>
                <ul th:if="${!global.isLogin}">
                    <!--  待登录 -->
                    <li class="nav-item">
                        <a
                                class="nav-link"
                                href="#"
                                data-toggle="modal"
                                data-target="#loginModal"
                        >
                            登录
                        </a>
                    </li>
                </ul>
                <ul th:if="${global.isLogin}" class="nav-right-user">
                    <!--  已登录 -->
                    <li class="nav-item nav-notice">
                        <a class="nav-link navbar-count-msg-box" href="/notice/">
                <span
                        th:if="${global.msgNum != null && global.msgNum > 0}"
                        th:text="${global.msgNum}"
                        class="navbar-count-msg"
                ></span>
                            <!-- 消息提醒的角标 -->
                            <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="icon"
                                    width="24"
                                    height="24"
                                    viewBox="0 0 24 24"
                                    stroke-width="2"
                                    stroke="currentColor"
                                    fill="none"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                            >
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                                <path
                                        d="M10 5a2 2 0 0 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"
                                ></path>
                                <path d="M9 17v1a3 3 0 0 0 6 0v-1"></path>
                            </svg>
                        </a>
                    </li>


                    <!-- 头像框 -->
                    <div class="nav-right-user">
                        <div class="nav-user-avatar">
                            <img
                                    class="nav-login-img"
                                    style="border-radius: 50%"
                                    th:src="${global.user.photo}"
                                    src="https://static.developers.pub/static/img/logo.b2ff606.jpeg"
                                    alt=""
                                    loading="lazy"
                            />
                            <div class="nav-user-arrow"></div>
                            <div class="nav-user-dropdown">
                                <div class="nav-user-dropdown-inner nav-user-dropdown::before">
                                    <!-- 下落框内容 -->
                                    <!--  调整为所有用户都可以直接看到管理后台  th:if="${#strings.equalsIgnoreCase(global.user.role, 'admin')}"-->
                                    <!-- 本地环境的时候不显示，本地环境的时候通过后端直接启动管理后台 -->
                                    <a
                                            th:if="${#strings.equals(global.env, 'prod')}"
                                            href="/admin/#/statistics/index"
                                            target="_blank"
                                            class="dropdown-item"
                                    >
                                        管理后台
                                    </a>
                                    <div
                                            th:if="${#strings.equalsIgnoreCase(global.user.role, 'admin')}"
                                            class="dropdown-divider"
                                    ></div>
                                    <a
                                            th:href="${'/user/home?userId=' + global.user.userId}"
                                            class="dropdown-item"
                                            href="#"
                                    >
                                        个人主页
                                    </a>
                                    <a id="logoutBtn" href="/logout" class="dropdown-item">登出</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </ul>
            </div>
        </div>
    </nav>
    <!-- 登录 Modal -->
    <div
            th:if="${!global.isLogin}"
            class="modal fade"
            id="loginModal"
            data-backdrop="static"
            data-keyboard="false"
            tabindex="-1"
            role="dialog"
            aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title">登录知校园畅享更多权益</h6>
                    <button
                            type="button"
                            class="close"
                            data-dismiss="modal"
                            aria-label="Close"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="auth-body">
                        <div class="login-main">
                            <!-- 分为上下两部分，下面是其他登录比如说 GitHub、验证码 -->
                            <div class="panel">
                                <h1 class="title">用户名密码登录</h1>
                                <!-- 登录表单、用户名和密码 -->
                                <form id="login-form">
                                    <div class="form-group">
                                        <input type="text" required autocomplete="off"
                                               class="form-control form-control-sm" id="username"
                                               placeholder="输入用户名"
                                               pattern="^[a-zA-Z0-9_]{4,16}$"
                                               minlength="4" maxlength="16"
                                               oninput="validateUsername()">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" required class="form-control form-control-sm"
                                               id="password" placeholder="输入密码"
                                               pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,20}$"
                                               minlength="8" maxlength="20"
                                               oninput="validatePassword()">
                                    </div>
                                    <div class="captcha-box">
                                        <div class="captcha-container"
                                             style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                                            <input type="text" id="captcha-input" placeholder="请输入验证码"/>
                                            <canvas id="captcha-canvas" width="120" height="40"></canvas>
                                            <button type="button" id="refresh-captcha" class="btn btn-secondary btn-sm">
                                                获取验证码/换一张
                                            </button>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-block btn-sm">登录</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <!-- 添加注册链接 -->
                    <div class="register-link text-center mt-2">
                        <a href="#" data-toggle="modal" data-target="#registerModal" class="mdnice-user-dialog-footer">没有账号？立即注册</a>
                    </div>
                    <div class="agreement-box">
                        <div class="mdnice-user-dialog-footer">
                            <p>登录即同意
                                <a href="article/detail/141"
                                   target="_blank" rel="noopener noreferrer">
                                    用户协议
                                </a> 和
                                <a href="article/detail/142"
                                   target="_blank" rel="noopener noreferrer">
                                    隐私政策
                                </a>
                            </p>
                        </div>
                    </div>
                    <div class="mock-login" th:if="${!#strings.equals(global.env, 'prod')}">

                        <button
                                id="mockLogin"
                                type="button"
                                th:data-verify-code="''"
                                class="btn btn-sm btn-dark"
                        >
                            一键游客登录
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- 注册Modal -->
    <div
            th:if="${!global.isLogin}"
            class="modal fade"
            id="registerModal"
            data-backdrop="static"
            data-keyboard="false"
            tabindex="-1"
            role="dialog"
            aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title">欢迎注册知校园畅享更多权益</h6>
                    <button
                            type="button"
                            class="close"
                            data-dismiss="modal"
                            aria-label="Close"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="auth-body">
                        <div class="login-main">
                            <div class="panel">
                                <h1 class="title">用户名密码注册</h1>
                                <!-- 注册表单、用户名和密码 -->
                                <form id="register-form">
                                    <div class="form-group">
                                        <input type="text" required autocomplete="off"
                                               class="form-control form-control-sm" id="register_username"
                                               placeholder="输入用户名(4-16位字母、数字或下划线)"
                                               pattern="^[a-zA-Z0-9_]{4,16}$"
                                               minlength="4" maxlength="16"
                                               oninput="validateUsername()">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" required class="form-control form-control-sm"
                                               id="register_password" placeholder="输入密码(8-20位，需包含大小写字母和数字)"
                                               pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,20}$"
                                               minlength="8" maxlength="20"
                                               oninput="validatePassword(); validateConfirmPassword()">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" required class="form-control form-control-sm"
                                               id="register_confirm_password" placeholder="再次输入密码"
                                               minlength="8" maxlength="20"
                                               oninput="validateConfirmPassword()">
                                        <small id="password-match-error" class="text-danger" style="display:none;">两次输入的密码不一致</small>
                                    </div>
                                    <div class="captcha-box">
                                        <div class="captcha-container"
                                             style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                                            <input type="text" id="register_captcha-input" placeholder="请输入验证码"/>
                                            <canvas id="register-captcha-canvas" width="120" height="40"></canvas>
                                            <button type="button" id="register_refresh-captcha" class="btn btn-secondary btn-sm">
                                                获取验证码/换一张
                                            </button>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-block btn-sm">注册</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="/js/sockjs.min.js" th:src="${global.siteInfo.oss + '/js/sockjs.min.js'}"></script>
    <script src="/js/stomp.min.js" th:src="${global.siteInfo.oss + '/js/stomp.min.js'}"></script>
    <script
            src="/js/mock.js"
            th:if="${!#strings.equals(global.env, 'prod')}"
    ></script>
    <script th:inline="javascript">
        // 是否自动刷新验证码
        let autoRefresh;
        const stateTag = $('#state'), codeTag = $('#code');
        $(document).ready(function () {
            let currentCodeKey = '';

            const register_canvas = document.getElementById('register-captcha-canvas');
            const canvas = document.getElementById('captcha-canvas');
            const ctx = canvas.getContext('2d');
            const register_ctx = register_canvas.getContext('2d');
            const refreshBtn = document.getElementById('refresh-captcha');
            const registerrefreshBtn = document.getElementById('register_refresh-captcha');
            // 保存当前验证码的 codeKey
            // 关键函数：显示验证码图片
            function showCaptcha() {
                fetch('/generateValidateCode')
                    .then(res => res.json())
                    .then(data => {
                        currentCodeKey = data.result.codeKey; // 存储 codeKey

                        const img = new Image();
                        img.onload = () => {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                        img.src = data.result.codeValue; // 直接使用接口返回的Base64图片数据
                    });
            }
            function showRegisterCaptcha() {
                fetch('/generateValidateCode')
                    .then(res => res.json())
                    .then(data => {
                        currentCodeKey = data.result.codeKey; // 存储 codeKey

                        const img = new Image();
                        img.onload = () => {
                            register_ctx.clearRect(0, 0, register_canvas.width, register_canvas.height);
                            register_ctx.drawImage(img, 0, 0, register_canvas.width, register_canvas.height);
                        };
                        img.src = data.result.codeValue; // 直接使用接口返回的Base64图片数据
                    });
            }

            // 点击按钮刷新
            refreshBtn.addEventListener('click', showCaptcha);
            registerrefreshBtn.addEventListener('click', showRegisterCaptcha);

            // 页面加载时显示第一个验证码
            showCaptcha();
            showRegisterCaptcha();

            // 登录
            $("#login-form").on("submit", function (event) {
                event.preventDefault();

                // 获取用户名和密码，没有定义 ID
                const username = $("#username").val();
                const password = $("#password").val();
                const captcha = $("#captcha-input").val();
                $.ajax({
                    url: "/login/username",
                    type: "POST",
                    data: {
                        username: username,
                        password: password,
                        captcha: captcha,
                        codeKey: currentCodeKey // 👈 把 codeKey 传给后端
                    },
                    success: function (response) {
                        console.log(response);
                        if (response.status.code === 0) {
                            // 登录成功
                            refreshPage();
                        } else {
                            // 登录失败
                            toastr.error(response.status.msg);
                        }
                    },
                    error: function (error) {
                        console.error(error);
                        // 出现错误时如何处理
                    }
                });
            });

            // 注册
            $("#register-form").on("submit", function (event) {
                event.preventDefault();
                if (!validateConfirmPassword()) {
                    e.preventDefault();
                    alert('请确保两次输入的密码一致');
                }
                // 获取用户名和密码，没有定义 ID
                const username = $("#register_username").val();
                const password = $("#register_password").val();
                const captcha = $("#register_captcha-input").val();

                $.ajax({
                    url: "/login/register",
                    type: "POST",
                    data: {
                        username: username,
                        password: password,
                        captcha: captcha,
                        codeKey: currentCodeKey // 👈 把 codeKey 传给后端
                    },
                    success: function (response) {
                        console.log(response);
                        if (response.status.code === 0) {
                            // 注册成功
                            refreshPage();
                        } else {
                            // 登录失败
                            toastr.error(response.status.msg);
                        }
                    },
                    error: function (error) {
                        console.error(error);
                        // 出现错误时如何处理
                    }
                });
            });
        });

        function validateConfirmPassword() {
            const password = document.getElementById('register_password').value;
            const confirmPassword = document.getElementById('register_confirm_password').value;
            const errorElement = document.getElementById('password-match-error');

            if (confirmPassword && password !== confirmPassword) {
                errorElement.style.display = 'block';
                return false;
            } else {
                errorElement.style.display = 'none';
                return true;
            }
        }



        $(".nav-article").click(() => {
            if ([[${global.isLogin}]]) {
                // 新页面打开文章编辑
                // 移除本地缓存
                localStorage.removeItem('articleTitle');
                window.open("/article/edit")
            }
        })

        // 定义一个刷新页面的方法
        function refreshPage() {
            if (window.location.pathname === "/login") {
                // 登录成功，跳转首页
                window.location.href = "/";
            } else {
                // 刷新当前页面
                window.location.reload();
            }
        }

        /**
         * 记录长连接
         * @type {null}
         */
        let sseSource = null;
        let intHook = null;
        let deviceId = null;

        /**
         * 建立半长连接，用于实现自动登录
         */
        function buildConnect() {
            if (sseSource != null) {
                try {
                    sseSource.close();
                } catch (e) {
                    console.log("关闭上次的连接", e);
                }
                try {
                    window.clearInterval(intHook);
                } catch (e) {
                }
            }

            if (!deviceId) {
                deviceId = getCookie("f-device");
            }
            const subscribeUrl = "/subscribe?deviceId=" + deviceId;
            const source = new EventSource(subscribeUrl);
            sseSource = source;

            source.onmessage = function (event) {
                let text = event.data.replaceAll("\"", "").trim();
                console.log("receive: " + text);

                let newCode;
                if (text.startsWith('refresh#')) {
                    // 刷新验证码
                    newCode = text.substring(8).trim();
                    codeTag.text(newCode);
                    stateTag.text("已刷新 ");
                } else if (text === 'scan') {
                    // 二维码扫描
                    stateTag.text("已扫描 ");
                } else if (text.startsWith('login#')) {
                    // 登录格式为 login#cookie
                    console.log("登录成功,保存cookie", text)
                    document.cookie = text.substring(6);
                    source.close();
                    refreshPage();
                } else if (text.startsWith("init#")) {
                    newCode = text.substring(5).trim();
                    codeTag.text(newCode);
                    console.log("初始化验证码: ", newCode);
                }

                if (newCode != null) {
                    try {
                        window.clearInterval(intHook);
                    } catch (e) {
                    }
                }

                if ([[${!#strings.equals(global.env, 'prod')}]]) {
                    $("#mockLogin").attr('data-verify-code', newCode);
                    $("#mockLogin2").attr('data-verify-code', newCode);
                }
            };

            source.onopen = function (evt) {
                deviceId = getCookie("f-device");
                console.log("开始订阅, 设备id=", deviceId, evt);
            }
            source.onerror = function (e, evt) {
                console.log("连接错误，重新开始", e, evt)
                stateTag.text("连接中断,请刷新重连");
                buildConnect(code);
            }

            fetchCodeCnt = 0;
            intHook = self.setInterval("fetchCode()", 1000);
        }

        let fetchCodeCnt = 0;

        function fetchCode() {
            if (deviceId) {
                if (++fetchCodeCnt > 5) {
                    // 为了避免不停的向后端发起请求，做一个最大的重试计数限制
                    try {
                        window.clearInterval(intHook);
                    } catch (e) {
                    }
                    return;
                }

                $.ajax({
                    url: "/login/fetch?deviceId=" + deviceId, type: "get", dataType: "text", success: function (data) {
                        console.log("data>>>>>>>>: ", data);
                        if (data != 'fail') {
                            codeTag.text(data);
                            try {
                                window.clearInterval(intHook);
                            } catch (e) {
                            }
                        }
                    },
                    error: function (e) {
                        console.log("some error! ", e);
                    }
                });
            } else {
                console.log("deviceId未获取，稍后再试!");
            }
        }

        function refreshCode() {
            $.ajax({
                url: "/login/refresh?deviceId=" + deviceId, dataType: "json", type: "get", success: function (data) {
                    const code = data['result']['code'];
                    const reconnect = data['result']['reconnect']
                    console.log("验证码刷新完成: ", data);

                    if (reconnect) {
                        // 重新建立连接
                        buildConnect();
                        $('#state').text("已刷新!");
                    } else if (code) {
                        if (codeTag.text() !== code) {
                            console.log("主动刷新验证码!");
                            codeTag.text(code);
                            stateTag.text("已刷新!");
                        } else {
                            console.log("验证码已刷新了!");
                        }
                    }
                }
            })
        }

        $('#loginModal').on('show.bs.modal', function () {
            console.log("登录弹窗已展示!");
            buildConnect();
        })
        $('#refreshCode').click(() => {
            refreshCode();
        })

        // 获取用户头像和下落框元素
        const navUserAvatar = document.querySelector('.nav-user-avatar');
        const navUserDropdown = document.querySelector('.nav-user-dropdown');

        if (navUserAvatar != null && navUserDropdown != null) {
            // 当鼠标点击用户头像时显示下落框
            navUserAvatar.addEventListener('click', () => {
                // 如果下落框是隐藏的，则显示；如果已经显示，则不处理
                if (navUserDropdown.style.display === 'none' || navUserDropdown.style.display === '') {
                    navUserDropdown.style.display = 'block';
                }
            });
            // 点击其他区域时隐藏下落框
            document.addEventListener('click', (event) => {
                // 如果点击的区域不是用户头像和下落框，则隐藏下落框
                if (!navUserAvatar.contains(event.target) && !navUserDropdown.contains(event.target)) {
                    navUserDropdown.style.display = 'none';
                }
            });
        }

        // --------------- 下面进入全局消息通知的入口 --------------
        function now() {
            return new Date().getTime()
        }

        // 用于全局消息通知的长连接
        let userWsSocket = null;
        let userWsClient = null;
        let userWsAckTime = 0;

        function autoBuildNotifyWsConnect() {
            const logined = [[${global.isLogin}]]
            if (!logined) {
                // 未登录
                return;
            }

            const session = getCookie("f-session");
            if (session) {
                console.log("登录成功，准备建立连接!!!");
                let protocol = window.location.protocol.replace("http", "ws");
                let host = window.location.host;
                userWsSocket = new WebSocket(`${protocol}//${host}/notify`);
                userWsClient = Stomp.over(userWsSocket);
                userWsClient.connect({"uname": $("#uname").val()}, function (frame) {
                    console.log('Connected: ' + frame);
                    userWsAckTime = now();
                    userWsClient.subscribe(`/user/msg`, function (message) {
                        // 订阅用户的私人broker，用于接收系统私发消息； 后台通过向 /user/xxx/topic/notify 发送消息，来传递给某个私人用户
                        console.log("系统消息: ", message);
                        userWsAckTime = now();
                        if (message.body != 'pong') {
                            let html = `<div>${message.body}</div><div><a href="/notice/" target="_blank" style="color:blue"> 查看详情 </a></div>`
                            toastr.success(html);
                        }
                    });

                    userWsClient.subscribe(`/msg`, function (message) {
                        // 订阅全局的消息
                        console.log("系统消息: ", message);
                        userWsAckTime = now();
                        if (message.body != 'pong') {
                            toastr.success(message.body);
                        }
                    });

                }, {id: session});
            }
        }


        function notifyWsCheck() {
            // 长连接的校验
            let nowTime = now();
            if (nowTime - userWsAckTime > 90_000) {
                console.log('未接收到返回消息，重新建立长连接!');
                autoBuildNotifyWsConnect();
            } else {
                userWsClient.send(`/app/msg/health`, {}, "ping");
            }
        }

        if ([[${global.isLogin}]]) {
            // 30s一次的ping/pong，用于长连接的保活
            notifyWsCheck();
            setInterval(notifyWsCheck, 30_000)
        }

    </script>
    <script>
        // 用户名实时验证
        function validateUsername() {
            const username = document.getElementById('username');
            const helpText = document.getElementById('username-help');
            const regex = /^[a-zA-Z0-9_]{4,16}$/;

            if (!regex.test(username.value)) {
                username.classList.add('is-invalid');
                helpText.classList.remove('text-muted');
                helpText.classList.add('text-danger');
            } else {
                username.classList.remove('is-invalid');
                helpText.classList.remove('text-danger');
                helpText.classList.add('text-muted');
            }
        }

        // 密码强度实时验证
        function validatePassword() {
            const password = document.getElementById('password');
            const helpText = document.getElementById('password-help');
            const hasLower = /[a-z]/.test(password.value);
            const hasUpper = /[A-Z]/.test(password.value);
            const hasNumber = /\d/.test(password.value);

            if (password.value.length < 8 || !hasLower || !hasUpper || !hasNumber) {
                password.classList.add('is-invalid');
                helpText.classList.remove('text-muted');
                helpText.classList.add('text-danger');
            } else {
                password.classList.remove('is-invalid');
                helpText.classList.remove('text-danger');
                helpText.classList.add('text-muted');
            }
        }

        // 表单提交前的最终验证
        document.querySelector('form').addEventListener('submit', function(e) {
            validateUsername();
            validatePassword();

            if (document.querySelector('.is-invalid')) {
                e.preventDefault();
                alert('请修正表单中的错误后再提交');
            }
        });
    </script>

    <style>
        .is-invalid {
            border-color: #dc3545;
        }
        .text-danger {
            color: #dc3545 !important;
        }
    </style>
</div>
</html>
