<svg xmlns="http://www.w3.org/2000/svg" width="80" height="100" viewBox="0 0 80 100">
	<!-- 定义川大校标红渐变（深红到暗红） -->
	<defs>
		<linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" style="stop-color:#CC0000;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
		</linearGradient>
	</defs>

	<!-- 居中且占满高度的钟楼 -->
	<g transform="translate(10, 0) scale(2)">
		<!-- 钟楼主体 -->
		<rect x="10" y="20" width="20" height="40" fill="url(#gradient)" />
		<!-- 钟楼顶部 -->
		<polygon points="20,0 30,10 10,10" fill="url(#gradient)" />
		<!-- 钟楼细节 -->
		<rect x="15" y="25" width="10" height="5" fill="#FFCCCC" fill-opacity="0.5" />
		<rect x="15" y="35" width="10" height="5" fill="#FFCCCC" fill-opacity="0.5" />
	</g>
</svg>
